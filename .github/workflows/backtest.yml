name: Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "tests/**"
      - "config.toml"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Restore candle cache
        uses: actions/cache@v4
        with:
          path: data/hourly
          key: candles-${{ github.run_id }}
          restore-keys: candles-
      - name: Run backtest on 3 years of Coinbase data
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.run_backtest --notify
      - name: Save reports
        run: bash scripts/save_to_git.sh "backtest $(date -u +%Y-%m-%d)" reports claude_project docs
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.notify "Backtest job failed. Check the Actions tab in the crypto-bot repo."
