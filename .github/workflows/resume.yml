name: Resume after halt

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-scan.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m bot.resume
      - run: bash scripts/save_to_git.sh "resume after halt" state
